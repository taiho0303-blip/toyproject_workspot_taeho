<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header}" />
<body>
<div class="container">
    <div th:replace="~{fragments/bodyHeader :: bodyHeader}" />
    <div>
        <div>
            <form class="form-inline" method="get">
                <div class="form-group mb-2">
                    <input type="text" name="userNickName" class="formcontrol" placeholder="작성자" th:value="${param.userNickName}"/>
                </div>
                <button type="submit" class="btn btn-primary mb-2">검색</button>
            </form>
        </div>

        <table class="table table-striped">
            <thead>
            <tr>
                <th>#</th>
                <th>제목</th>
                <th>작성자</th>
                <th>장소</th>
                <th>등록시간</th>
                <th>리뷰보기</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="review : ${reviews}">
                <td th:text="${reviewStat.count}"></td>
                <td th:text="${review.title}"></td>
                <td th:text="${review.user.nickName}"></td>
                <td th:text="${review.spot.title}"></td>
                <td th:text="${#temporals.format(review.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
                <td>
                    <form th:action="@{/review/{reviewId}(reviewId=${review.id})}" method="get">
                        <button type="submit" class="btn btn-info">리뷰보기</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
    <div th:replace="~{fragments/footer :: footer}" />
</div> <!-- /container -->
</body>
</html>
