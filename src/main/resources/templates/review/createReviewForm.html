<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header}" />
<body>
<div class="container">
    <div th:replace="~{fragments/bodyHeader :: bodyHeader}" />

    <div class="py-5 text-center">
        <h2>리뷰 등록</h2>
    </div>

    <div class="row">
        <div class="col-md-8 order-md-1">
            <form th:action="@{/review/new}" th:object="${reviewForm}" method="post">
                <input type="hidden" th:field="*{userId}">
                <input type="hidden" th:field="*{spotId}">

                <div class="mb-3">
                    <label th:for="title">리뷰 제목</label>
                    <input type="text" th:field="*{title}" class="form-control"
                           placeholder="제목을 입력하세요" required>
                </div>

                <div class="mb-3">
                    <label th:for="content">내용</label>
                    <textarea th:field="*{content}" class="form-control"
                              rows="5" placeholder="솔직한 후기를 남겨주세요" required></textarea>
                </div>

                <hr class="mb-4">
                <div class="row">
                    <div class="col">
                        <button class="w-100 btn btn-primary btn-lg" type="submit">등록하기</button>
                    </div>
                    <div class="col">
                        <button class="w-100 btn btn-secondary btn-lg"
                                th:onclick="|location.href='@{/}'|" type="button">취소</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}" />
</div> </body>
</html>
